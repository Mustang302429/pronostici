name: Aggiorna pronostici

on:
  schedule:
    # minuti "strani" apposta: agli orari tondi GitHub fa partire i lavori anche con 1-2 ore di ritardo
    - cron: "17 5 * * *"     # 06:17 ora italiana d'inverno (07:17 in estate)
    - cron: "47 10 * * *"    # 11:47: quote e formazioni probabili per le partite del pomeriggio
    - cron: "23 12 * * 6,0"  # 13:23 sabato e domenica: formazioni ufficiali delle 14:30-15:00
    - cron: "13 15 * * *"    # 16:13: partite delle 18:00
    - cron: "41 18 * * *"    # 19:41: formazioni ufficiali delle partite delle 20:45 e quote aggiornate
    - cron: "37 22 * * *"    # 23:37: risultati della sera e partite notturne (Sudamerica, MLS)
  workflow_dispatch:        # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pronostici
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcola i pronostici (ramo 1 + ramo 2)
        run: python -m motore.genera --solo-sito
      - name: Schedine speciali (Sudamerica 1X2 e campionati da gol)
        continue-on-error: true
        run: python -m motore.mondo
      - name: Salva archivio e dati nel repository
        run: |
          git config user.name "pronostici-bot"
          git config user.email "pronostici-bot@users.noreply.github.com"
          git add dati/archivio_pronostici.csv dati/archivio_mondo.csv docs/data.json docs/mondo.json
          git commit -m "Aggiornamento $(date '+%Y-%m-%d %H:%M')" || echo "niente da salvare"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
