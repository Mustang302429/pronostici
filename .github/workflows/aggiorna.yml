name: Aggiorna pronostici

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pronostici
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcola i pronostici
        run: python -m motore.genera --solo-sito
      - name: Salva archivio e dati
        run: |
          git config user.name "pronostici-bot"
          git config user.email "pronostici-bot@users.noreply.github.com"
          git add dati/archivio_pronostici.csv docs/data.json
          git commit -m "Aggiornamento $(date '+%Y-%m-%d %H:%M')" || echo "niente da salvare"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
